<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff1a8">
  <meta name="description" content="Rabindra Manas Sanstha — Laxmi Puja & Annual Cultural Programme 2026">
  <title>Rabindra Manas Sanstha — Laxmi Puja & Annual Cultural Programme 2026</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff8e8; font-family: system-ui, -apple-system, "Noto Sans Bengali", sans-serif; color: #3d1600; }
    .wrap { width: min(900px, 100%); margin: auto; padding: 16px 12px 32px; }
    header { text-align: center; padding: 22px 12px 18px; background: linear-gradient(135deg, #fff1a8, #ffd76a); border-radius: 18px; box-shadow: 0 5px 20px #8b5a001c; }
    h1 { margin: 0; font-size: clamp(25px, 6vw, 42px); line-height: 1.3; color: #8b1a00; }
    h2 { margin: 8px 0 0; font-size: clamp(17px, 4vw, 24px); line-height: 1.4; font-weight: 600; }
    .fixture { margin-top: 18px; background: #fff; padding: 8px; border-radius: 18px; box-shadow: 0 5px 20px #6b3b0018; }
    .fixture img { display: block; width: 100%; height: auto; border-radius: 12px; }
    .note { text-align: center; color: #725f52; margin: 14px 4px 0; font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <h1>রবীন্দ্র মানস সংস্থা</h1>
      <h2>লক্ষ্মী পূজা ও বার্ষিক সাংস্কৃতিক অনুষ্ঠান ২০২৬</h2>
    </header>
    <section class="fixture" aria-label="২০২৬ সালের অনুষ্ঠান সূচি">
      <img src="programme-2026.jpg" alt="রবীন্দ্র মানস সংস্থার লক্ষ্মী পূজা ও বার্ষিক সাংস্কৃতিক অনুষ্ঠান ২০২৬-এর সম্পূর্ণ অনুষ্ঠান সূচি">
    </section>
    <p class="note">এই পেজে প্রথমে ২০২৬ সালের অনুষ্ঠান সূচি দেখানো হচ্ছে। পরবর্তী সময়ে সংস্থার ছবি, পূর্ববর্তী বছরের অনুষ্ঠান গ্যালারি ও অন্যান্য তথ্য যোগ করা যাবে।</p>
  </main>
</body>
</html>
